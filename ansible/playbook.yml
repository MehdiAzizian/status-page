- hosts: web
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker
      apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Let ubuntu run docker without sudo
      user:
        name: ubuntu
        groups: docker
        append: true


    - name: Clone app from GitHub
      git:
        repo: https://github.com/MehdiAzizian/status-page.git
        dest: /home/ubuntu/status-page

    - name: Start app with Compose
      community.docker.docker_compose_v2:
        project_src: /home/ubuntu/status-page


    - name: SSH - no passwords, no root login
      copy:
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        content: |
          PasswordAuthentication no
          PermitRootLogin no
      notify: Restart ssh

    - name: Firewall - allow SSH, HTTP, HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ["22", "80", "443"]

    - name: Firewall - turn on, deny the rest
      community.general.ufw:
        state: enabled
        policy: deny

  handlers:
    - name: Restart ssh
      service:
        name: ssh
        state: restarted
