- hosts: web
  become: true
  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker
      apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present

    - name: Let ubuntu run docker without sudo
      user:
        name: ubuntu
        groups: docker
        append: true


    - name: Clone app from GitHub
      git:
        repo: https://github.com/MehdiAzizian/status-page.git
        dest: /home/ubuntu/status-page

    - name: Start app with Compose
      community.docker.docker_compose_v2:
        project_src: /home/ubuntu/status-page
