apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  strategy:
    type: Recreate                     # NEW: stop old Pod first
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: postgres:16
          env:
            - name: POSTGRES_PASSWORD
              value: secret
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: data                         # NEW
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: init
          configMap:
            name: db-init
        - name: data                             # NEW
          persistentVolumeClaim:
            claimName: db-data
---
apiVersion: v1
kind: PersistentVolumeClaim                      # NEW: "I need 1 GB"
metadata:
  name: db-data
spec:
  accessModes:
    - ReadWriteOnce                              # one node can write
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
    - port: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init
data:
  init.sql: |
    CREATE TABLE components (
      id     SERIAL PRIMARY KEY,
      name   TEXT NOT NULL,
      status TEXT NOT NULL DEFAULT 'operational'
    );
    INSERT INTO components (name) VALUES ('Website'), ('Login'), ('API');