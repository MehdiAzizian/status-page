apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: postgres:16
          env:
            - name: POSTGRES_PASSWORD
              value: secret
          ports:
            - containerPort: 5432

---
apiVersion: v1
kind: Service
metadata:
  name: db          # the DNS name the app uses
spec:
  selector:
    app: db         # send traffic to Pods with this sticker
  ports:
    - port: 5432
