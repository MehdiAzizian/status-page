apiVersion: apps/v1          # which API this kind of object belongs to
kind: Deployment             # the object type
metadata:
  name: app                  # its name in k3s
spec:
  replicas: 1                # keep 1 Pod running
  selector:
    matchLabels:
      app: status-page       # "my Pods are the ones with this label"
  template:                  # the recipe for each Pod
    metadata:
      labels:
        app: status-page     # the label put on each Pod (must match the selector above)
    spec:
      containers:
        - name: app
          image: ghcr.io/mehdiazizian/status-page:IMAGE_TAG
          env:
            - name: DATABASE_URL
              value: postgres://postgres:secret@db:5432/postgres   # copied from compose.yaml
          ports:
            - containerPort: 8081
          readinessProbe:    # the readiness check you learned
            httpGet:
              path: /healthz
              port: 8081




---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app: status-page      # the app Pod's sticker
  ports:
    - port: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
spec:
  rules:
    - http:
        paths:
          - path: /               # every path...
            pathType: Prefix
            backend:
              service:
                name: app         # ...goes to the Service app
                port:
                  number: 8081
