receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: status-page
          scrape_interval: 15s
          static_configs:
            - targets: ["app:8081"]
        - job_name: node
          scrape_interval: 15s
          static_configs:
            - targets: ["node-exporter:9100"]


exporters:
  prometheusremotewrite:
    endpoint: http://victoriametrics:8428/api/v1/write

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [prometheusremotewrite]
