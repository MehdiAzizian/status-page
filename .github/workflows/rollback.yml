name: Rollback
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Full commit SHA to go back to"
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
      - name: Rollback with SSM
        run: |
          ID=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=status-page Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          CMD=$(aws ssm send-command --instance-ids "$ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["export HOME=/root TAG=${{ inputs.tag }}","cd /home/ubuntu/status-page","docker compose pull app","docker compose up -d --no-build"]' \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD" --instance-id "$ID"
